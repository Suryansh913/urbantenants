{% load static %}<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}UrbanTents · Employee Dashboard{% endblock %}</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#1B2420; --surface:#232E28; --surface2:#2A362F;
  --canvas:#EDE3CF; --canvas-dim:#C9BFA9;
  --gold:#C9A227; --rust:#B5563C; --sage:#6FA287; --dusty:#5C8AA6;
  --line:#3A473F; --shadow:0 10px 30px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 15% 8%, rgba(201,162,39,0.06), transparent 40%),
    radial-gradient(circle at 85% 92%, rgba(92,138,166,0.06), transparent 40%),
    var(--bg);
  color:var(--canvas); font-family:'Work Sans', sans-serif; min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono', monospace;}
a{color:inherit;}

.gate-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:22px; padding:24px; text-align:center;}
.gate-wrap h1{font-family:'Fraunces', serif; font-weight:700; font-size:clamp(28px,5vw,40px); margin:0;}
.gate-wrap p{color:var(--canvas-dim); margin:0; font-size:14px; max-width:360px;}
.gate-box{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:28px; width:min(340px,90vw); box-shadow:var(--shadow);}
.gate-box input{width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--canvas); font-family:'IBM Plex Mono', monospace; font-size:15px; letter-spacing:1px; outline:none; margin-bottom:12px;}
.gate-box input:focus{border-color:var(--gold);}
.gate-err{color:var(--rust); font-size:13px; margin-bottom:8px; min-height:16px;}
.gate-hint{font-size:12px; color:var(--canvas-dim); opacity:0.7;}

.btn{border:none; border-radius:8px; padding:12px 18px; font-family:'Work Sans', sans-serif; font-weight:600; font-size:14px; cursor:pointer; transition:transform .15s ease, filter .15s ease;}
.btn:hover{filter:brightness(1.08); transform:translateY(-1px);}
.btn-gold{background:var(--gold); color:#1B2420;}
.btn-ghost{background:transparent; border:1px solid var(--line); color:var(--canvas);}

header.top{display:flex; align-items:center; justify-content:space-between; padding:22px clamp(16px,4vw,40px); border-bottom:1px solid var(--line); gap:16px; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:12px;}
.brand h1{font-size:20px; margin:0; font-weight:700;}
.brand span{display:block; font-size:11px; color:var(--gold); letter-spacing:2px; text-transform:uppercase; margin-top:2px;}
.stats{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 14px; text-align:center; min-width:70px;}
.stat b{display:block; font-family:'Fraunces',serif; font-size:20px;}
.stat small{font-size:10px; color:var(--canvas-dim); text-transform:uppercase; letter-spacing:1px;}

.toolbar{display:flex; gap:12px; padding:18px clamp(16px,4vw,40px); flex-wrap:wrap; align-items:center;}
.toolbar input[type=text]{flex:1; min-width:200px; padding:11px 14px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--canvas); font-size:14px; outline:none;}
.toolbar input[type=text]:focus{border-color:var(--gold);}

main{padding:0 clamp(16px,4vw,40px) 60px;}
.board{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
@media(max-width:860px){.board{grid-template-columns:1fr;}}

.column{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden;}
.col-head{padding:16px 18px 14px; border-bottom:1px dashed var(--line); background-image:radial-gradient(circle, var(--bg) 2.5px, transparent 2.6px); background-size:16px 100%; background-position:0 -2px;}
.col-head .row{display:flex; align-items:center; justify-content:space-between;}
.col-head h2{margin:0; font-family:'Fraunces',serif; font-size:17px; font-weight:600;}
.col-head .count{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--canvas-dim);}
.col-active .col-head{border-top:4px solid var(--sage);}
.col-booked .col-head{border-top:4px solid var(--dusty);}
.col-lost .col-head{border-top:4px solid var(--rust);}
.col-body{padding:14px; display:flex; flex-direction:column; gap:12px; min-height:120px;}
.empty-note{color:var(--canvas-dim); font-size:13px; text-align:center; padding:26px 10px; opacity:0.7;}

.card{background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:14px; transition:transform .15s ease, box-shadow .15s ease;}
.card:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,0.25);}
.card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.card-name{font-weight:600; font-size:15px;}
.card-id{font-size:10px; color:var(--gold); letter-spacing:0.5px;}
.card-meta{margin-top:8px; font-size:13px; color:var(--canvas-dim); line-height:1.7;}
.card-meta a{color:var(--dusty); text-decoration:none;}
.card-date{font-size:11px; color:var(--canvas-dim); opacity:0.65; margin-top:6px;}
.card-latest{margin-top:10px; padding:8px 10px; background:var(--bg); border:1px solid var(--line); border-radius:8px; font-size:12.5px;}
.card-latest .who{color:var(--gold); font-size:10px; text-transform:uppercase; letter-spacing:1px; margin-bottom:3px; display:block;}
.card-actions{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
.pill{border:1px solid var(--line); background:transparent; color:var(--canvas-dim); font-size:11px; padding:5px 9px; border-radius:20px; cursor:pointer; font-family:'Work Sans',sans-serif; transition:all .15s ease;}
.pill:hover{border-color:var(--gold); color:var(--canvas);}
.pill.danger:hover{border-color:var(--rust); color:var(--rust);}
form.inline-pill{display:inline;}

.fab{position:fixed; bottom:26px; right:26px; background:var(--gold); color:#1B2420; border:none; border-radius:50px; padding:15px 22px; font-weight:700; font-size:14px; cursor:pointer; box-shadow:var(--shadow); z-index:20;}
.fab:hover{filter:brightness(1.06);}

.overlay{display:none; position:fixed; inset:0; background:rgba(10,14,11,0.6); backdrop-filter:blur(3px); align-items:center; justify-content:center; z-index:50; padding:16px;}
.overlay.show{display:flex;}
.modal{background:var(--surface); border:1px solid var(--line); border-radius:16px; width:min(440px,100%); padding:26px; box-shadow:var(--shadow); position:relative; max-height:88vh; overflow-y:auto;}
.modal h3{margin:0 0 4px; font-family:'Fraunces',serif; font-size:20px;}
.modal .sub{color:var(--canvas-dim); font-size:12px; margin-bottom:18px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; color:var(--canvas-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:1px;}
.field input, .field textarea, .field select,
.gate-box input{
  width:100% !important;
  display:block !important;
  box-sizing:border-box !important;
  padding:11px 12px !important;
  border-radius:8px !important;
  border:1px solid var(--line) !important;
  background:var(--bg) !important;
  color:var(--canvas) !important;
  font-size:14px !important;
  line-height:1.4 !important;
  outline:none !important;
  font-family:'Work Sans', sans-serif !important;
  -webkit-appearance:none !important;
  appearance:none !important;
  margin:0 0 12px 0 !important;
  height:auto !important;
  min-height:42px !important;
  opacity:1 !important;
  visibility:visible !important;
}
.field textarea{resize:vertical !important; min-height:70px !important;}
.field input:focus, .field textarea:focus, .field select:focus,
.gate-box input:focus{border-color:var(--gold) !important; box-shadow:none !important;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
.close-x{position:absolute; top:16px; right:18px; background:none; border:none; color:var(--canvas-dim); font-size:20px; cursor:pointer;}

.timeline{max-height:340px; overflow-y:auto; padding-right:4px; margin-top:4px;}
.timeline-item{position:relative; padding:0 0 16px 20px; border-left:2px solid var(--line);}
.timeline-item:last-child{border-left:2px solid transparent; padding-bottom:0;}
.timeline-item::before{content:''; position:absolute; left:-6px; top:2px; width:10px; height:10px; border-radius:50%; background:var(--gold); border:2px solid var(--surface);}
.timeline-item .t-text{font-size:13.5px; color:var(--canvas); line-height:1.5;}
.timeline-item .t-meta{font-size:11px; color:var(--canvas-dim); margin-top:3px;}
.t-status{display:inline-block; font-size:10px; padding:2px 8px; border-radius:20px; margin-bottom:5px; text-transform:uppercase; letter-spacing:0.5px;}
.t-status.active{background:rgba(111,162,135,0.18); color:var(--sage);}
.t-status.booked{background:rgba(92,138,166,0.18); color:var(--dusty);}
.t-status.lost{background:rgba(181,86,60,0.18); color:var(--rust);}

.messages{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:60; display:flex; flex-direction:column; gap:8px; align-items:center;}
.msg{background:var(--gold); color:#1B2420; font-weight:600; font-size:13px; padding:10px 18px; border-radius:30px; box-shadow:var(--shadow);}
.msg.error{background:var(--rust); color:#fff;}

footer.note{text-align:center; color:var(--canvas-dim); font-size:11px; padding:20px; opacity:0.6;}
</style>
</head>
<body>
{% if messages %}
<div class="messages">
  {% for message in messages %}
    <div class="msg {% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</div>
  {% endfor %}
</div>
<script>setTimeout(()=>{document.querySelectorAll('.msg').forEach(m=>m.remove());}, 3000);</script>
{% endif %}

{% block content %}{% endblock %}

</body>
</html>
