<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — AI Rakhi Challenge</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap');
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'DM Sans',sans-serif; background:#faf6ee; color:#14213d; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:20px; }
  .card{ background:#fff; border:1px solid #e9e2d3; border-radius:18px; padding:44px; max-width:480px; width:100%; }
  .eyebrow{ font-size:12.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:#f5a623; margin-bottom:12px; }
  h1{ font-family:'Sora',sans-serif; font-weight:800; font-size:26px; color:#0b2545; margin-bottom:10px; }
  p.sub{ color:#5a6178; font-size:14.5px; margin-bottom:26px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-family:'Sora',sans-serif; font-weight:600; font-size:13px; color:#0b2545; margin-bottom:6px; }
  .field input{ width:100%; padding:12px 14px; border:1.5px solid #ddd2b8; border-radius:9px; font-size:14.5px; }
  .field input:focus{ outline:none; border-color:#f5a623; }
  .btn{ width:100%; background:#0b2545; color:#fff; font-family:'Sora',sans-serif; font-weight:700; font-size:15px; padding:14px; border:none; border-radius:9px; cursor:pointer; margin-top:6px; }
  .btn:hover{ background:#153468; }
  .msg{ margin-top:16px; padding:12px 14px; border-radius:9px; font-size:13.5px; }
  .msg.ok{ background:#e8f5e9; color:#2e7d32; }
  .msg.err{ background:#fdecea; color:#c62828; }
  .back{ display:block; text-align:center; margin-top:20px; font-size:13px; color:#2563eb; text-decoration:none; }

  /* ===== Ad slots ===== */
  .ad-slot{
    max-width:480px; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .ad-slot .ad-box{
    width:100%; min-height:100px; background:#f4f0e6; border:1px solid #e9e2d3;
    border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px; overflow:hidden;
  }
  .ad-slot .ad-label{ font-size:11px; color:rgba(11,37,69,.5); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">AI Rakhi Challenge</div>
    <h1>Register Karo</h1>
    <p class="sub">Registration ke baad apni entry "Submit Entry" page se jama karna hoga.</p>

    {% if messages %}
      {% for message in messages %}
        <div class="msg {% if message.tags == 'error' %}err{% else %}ok{% endif %}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post" action="">
      {% csrf_token %}
      <div class="field">
        <label>Name / Team Name *</label>
        <input type="text" name="r_name" required placeholder="e.g. Ayesha Khan">
      </div>
      <div class="field">
        <label>College / City</label>
        <input type="text" name="r_college" placeholder="e.g. Chandigarh University">
      </div>
      <div class="field">
        <label>Phone / Email</label>
        <input type="text" name="r_contact" placeholder="For updates about the challenge">
      </div>
      <div class="field">
        <label>Instagram Handle</label>
        <input type="text" name="r_handle" placeholder="@yourhandle">
      </div>
      <button type="submit" class="btn">Register Now</button>
    </form>

    <a href="{% url 'rakhi_idea' %}" class="back">← Concept dobara dekho</a>
  </div>

  <!-- ===== Ad Slot 1: below the form card ===== -->
  <div class="ad-slot">
    <div class="ad-box">
      <span class="ad-label">Advertisement</span>
      <script async="async" data-cfasync="false" src="https://pl30962904.profitableratecpmnetwork.com/ab5ad89de4536f6a4c91618ed6d31e2b/invoke.js"></script>
      <div id="container-ab5ad89de4536f6a4c91618ed6d31e2b"></div>
    </div>
  </div>

  <!-- ===== Ad Slot 2: second banner (isolated in an iframe — this network
       uses a global "atOptions" variable, so it needs its own document
       context to avoid clashing with any other atOptions on the page) ===== -->
  <div class="ad-slot">
    <div class="ad-box">
      <span class="ad-label">Advertisement</span>
      <iframe
          title="advertisement"
          style="width:100%; max-width:300px; height:250px; border:0; overflow:hidden;"
          scrolling="no"
          srcdoc="<!DOCTYPE html><html><head><style>html,body{margin:0;padding:0;background:transparent;display:flex;align-items:center;justify-content:center;}</style></head><body><script type='text/javascript'>atOptions={'key':'f1555ec31b5fc0b04955e6ccfe8e1fcd','format':'iframe','height':250,'width':300,'params':{}};<\/script><script src='https://www.highrevenueformat.com/f1555ec31b5fc0b04955e6ccfe8e1fcd/invoke.js'><\/script></body></html>">
      </iframe>
    </div>
  </div>

  <!-- ===== Pop-under ad: fires on click anywhere on the page ===== -->
  <script src="https://pl30952486.profitableratecpmnetwork.com/19/f7/21/19f7214935789d460138fbbc976d7beb.js"></script>

</body>
</html>
